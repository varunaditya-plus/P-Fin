name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: p-fin-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      changelog: ${{ steps.parse.outputs.changelog }}
    steps:
      - name: Read the release marker at the end of the commit subject
        id: parse
        run: |
          SUBJECT=$(jq -r '(.head_commit.message // "") | split("\n")[0] | rtrimstr("\r")' "$GITHUB_EVENT_PATH")
          if [[ "$SUBJECT" =~ \(v([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            MARKER="${BASH_REMATCH[0]}"
            if (( ${#VERSION} > 128 )); then
              echo "::error::The version exceeds Docker's 128-character tag limit."
              exit 1
            fi
            CHANGELOG=$(printf '%s' "${SUBJECT%"$MARKER"}" | sed -E 's/^[a-z]+(\([^)]*\))?!?:[[:space:]]*//; s/^[[:space:]]+|[[:space:]]+$//g')
            printf 'version=%s\nchangelog=%s\n' "$VERSION" "${CHANGELOG:-Release $VERSION}" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION"
          else
            printf 'version=\n' >> "$GITHUB_OUTPUT"
            echo "No release marker at the end of the commit subject; skipping publication."
          fi

  checks:
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/linting_testing.yml

  release:
    needs: [version, checks]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: v${{ needs.version.outputs.version }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'varunadityaaga' }}/p-fin
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to overwrite an existing release or a different commit's tag
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "::error::The release tag already points to a different commit."
              exit 1
            }
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.RELEASE_TAG,
              });
              core.setFailed('This version already has a GitHub release. Use a new version.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'varunadityaaga' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build AMD64, ARM64 and ARMv7 images without publishing release tags yet
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=p-fin
          cache-to: type=gha,mode=max,scope=p-fin

      - name: Verify all architectures and test the published image by digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$RUNNER_TEMP/image-manifest.json"
          jq -e '
            [.manifests[].platform | [.os, .architecture, (.variant // "")] | join("/")] as $platforms |
            ($platforms | index("linux/amd64/")) != null and
            (any($platforms[]; startswith("linux/arm64/"))) and
            ($platforms | index("linux/arm/v7")) != null
          ' "$RUNNER_TEMP/image-manifest.json"
          docker pull "$IMAGE@$DIGEST"
          PFIN_TEST_IMAGE="$IMAGE@$DIGEST" node --test deploy/docker.test.mjs

      - name: Publish latest and the exact four-part Docker version
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          # Keep the numbered tag newest so the shieldcn Docker Version badge shows it.
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"

      - name: Create the GitHub tag and release at the tested commit
        env:
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: |
          {
            printf '%s\n\n' "$CHANGELOG"
            printf 'Docker image: `%s:%s` (also available as `latest`).\n\n' "$IMAGE" "$VERSION"
            printf 'Supports AMD64, ARM64 and ARMv7. See the [installation guide](https://github.com/%s/blob/%s/README.md#installation).\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "P-Fin $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            docker-compose.yaml example.env
