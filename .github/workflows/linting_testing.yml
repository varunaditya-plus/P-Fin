name: Linting and Testing

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  linting:
    name: Run Linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install pnpm packages
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run ESLint
        run: pnpm run lint

  docker:
    name: Build and test Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          tags: p-fin:local
          context: .
          cache-from: type=gha,scope=p-fin
          cache-to: type=gha,mode=max,scope=p-fin

      - name: Check Compose configuration
        run: docker compose config --quiet

      - name: Test the running image and service proxies
        run: node --test deploy/docker.test.mjs
