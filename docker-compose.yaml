services:
  p-fin:
    image: ${PFIN_IMAGE:-varunadityaaga/p-fin:latest}
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      SEERR_URL: ${SEERR_URL:-}
    ports:
      - "${PFIN_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
